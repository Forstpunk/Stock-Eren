[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday"
version = "0.1.0"
description = "Measurement instrument for intraday setup edge on NSE equities. Never emits signals."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyarrow>=15",
    "scipy>=1.12",
    "rich>=13",
    "pytest>=8",
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
include = ["intraday*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
